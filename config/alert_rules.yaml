alerts:
  - name: high_latency_p95
    severity: critical
    condition: 'latency_p95_ms > 3000 for 2 consecutive evaluations'
    type: symptom-based
    owner: platform
    runbook: docs/alerts.md#alert-1
  - name: error_rate_breach
    severity: high
    condition: 'error_rate_pct > 2 for 2 consecutive evaluations'
    type: symptom-based
    owner: platform
    runbook: docs/alerts.md#alert-2
  - name: cost_breach
    severity: medium
    condition: 'total_cost_usd > 2.5 over the 60-minute window'
    type: symptom-based
    owner: platform
    runbook: docs/alerts.md#alert-3
